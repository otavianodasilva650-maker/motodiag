Object.assign(r,v,{ed:1,data:d.split(",")[0]});if(ch.length)DB.log.unshift(d+" — "+mn(MOTOS[r.moto])+" · "+c+" ("+ch.join("; ")+")")}
DB.log=DB.log.slice(0,300);S.eid=null;save();R()}
function mform(){return `<div class="card" style="border:2px solid var(--ac)"><h3 style="margin-top:0">Nova moto ou versão</h3><label>Marca</label><select id="m_b"><option>Honda</option><option>Yamaha</option><option>Outra</option></select><input id="m_o" placeholder="Se for outra marca, escreva aqui"><label>Modelo</label><input id="m_m" placeholder="Ex.: Titan 160 Start"><label>Ano ou faixa de anos</label><input id="m_a" placeholder="Ex.: 2026 ou 2019/2022"><button class="btn pri" style="width:100%" onclick="addMoto()">Cadastrar</button></div>`}
function addMoto(){const b=$("#m_b").value==="Outra"?($("#m_o").value.trim()||"Outra"):$("#m_b").value,m=$("#m_m").value.trim(),a=$("#m_a").value.trim();if(!m||!a){alert("Informe o modelo e o ano.");return}
const id=Math.max(9999,...DB.motos.map(x=>x.id))+1,mt={id,marca:b,modelo:m,ano:a};DB.motos.push(mt);MOTOS[id]={...mt,pag:""};DB.log.unshift(new Date().toLocaleString("pt-BR")+" — nova moto: "+b+" "+m+" "+a);save();S.nm=false;S.tab="vis";S.eid=null;go("fic",id)}
function cnt(m){return DB.rec.filter(r=>r.moto==m.id&&r.st!="inativo").length}
function tbl(rs){if(!rs.length)return `<div class="card mu">Nenhum parâmetro cadastrado nesta aba ainda. Use o botão acima para adicionar.</div>`;
const pend=rs.filter(r=>r.st!="verificado").length,key=r=>r.tipo=="mec"&&r.sis=="elétrico geral"?"motor e lubrificação":r.sis,g={};rs.forEach(r=>{(g[key(r)]=g[key(r)]||[]).push(r)});
const row=r=>`<tr><td><b>${esc(r.comp)}</b>${r.cond?`<br><span class="mu">${esc(r.cond)}</span>`:""}${r.met?`<br><span class="mu">⚠ ${esc(r.met)}</span>`:""}</td><td>${esc(r.min||"—")}</td><td>${esc(r.nom||"—")}</td><td>${esc(r.max||"—")}</td><td>${esc(r.un||"")}</td><td><span class="tag t-${r.st}" title="${ST[r.st]}">${({verificado:"✓",pendente:"pend.",revisao:"rev.",divergente:"div.",desatualizado:"desat."})[r.st]||r.st}</span></td><td><button class="back" onclick="editRec(${r.id})" title="Editar">✎</button></td></tr>`;
return `<div class="warn ${pend?"":"okb"}">${pend?`<b>${pend} de ${rs.length}</b> registros ainda não verificados: não trate como especificação oficial até a conferência.`:"Todos os registros desta aba estão verificados."}</div>`+Object.entries(g).map(([s,l])=>`<h3>${esc(s)} · ${l.length}</h3><div class="card tw"><table><tr><th>Componente / condição</th><th>Mín</th><th>Nom.</th><th>Máx</th><th>Un.</th><th></th><th></th></tr>${l.map(row).join("")}</table></div>`).join("")}
function tblOld(rs){if(!rs.length)return `<div class="card mu">Sem dados cadastrados ou confirmados para esta versão (${esc(S.tab)}).</div>${AV}`;
return rs.map(r=>`<div class="card"><b>${esc(r.comp)}</b> · ${TIPOS[r.tipo]} ${tag(r.st)}<div class="tw"><table><tr><th>Mín</th><th>Nominal</th><th>Máx</th><th>Unid.</th></tr><tr><td>${esc(r.min||"—")}</td><td>${esc(r.nom||"—")}</td><td>${esc(r.max||"—")}</td><td>${esc(r.un||"—")}</td></tr></table></div>
<p class="mu">Condições: ${esc(r.cond||"Dado não confirmado")}<br>Método: ${esc(r.met||"Dado não confirmado")}<br>Fonte: ${esc(r.fonte)} ${r.pag?"· p. "+esc(r.pag):""} · atualizado em ${esc(r.data)}</p>${r.st!="verificado"?`<div class="warn">Validação pendente: não trate como especificação oficial.</div>`:""}</div>`).join("")}
function cl(){const q=(S.cq||"").toLowerCase().trim();const l=CODES.filter(c=>!q||(c[0]+" "+c[1]+" "+c[2]).toLowerCase().includes(q));return l.length?l.map(c=>`<div class="card row" style="cursor:default"><div><b>${c[0]} ${c[0]==1?"piscada":"piscadas"}</b> · ${esc(c[1])}<br><span class="mu">${esc(c[2])}</span></div><span class="tag t-pendente">Pendente de conferência</span></div>`).join(""):`<div class="card mu">Nenhum código encontrado.</div>`}
function codes(m){if(!/^(Biz|Pop|Titan|CB 300|CB 250F|CG 125i|CG Start|CRF 250F|Fan 150|NXR|NX 400i|XRE|XR 300L)/.test(m.modelo)||m.marca!="Honda")return `<div class="warn">Não há tabela de códigos de falha confirmada para esta moto. Motos carburadas não têm central eletrônica e, por isso, não geram códigos. Os códigos cadastrados valem para as Honda injetadas Biz, Titan 150, Titan 160, Pop 110i, CB 300, CB 300F, CB 250F, CG 125i, CG Start, CRF 250F, Fan 150, NXR Bros, NX 400i Falcon, XRE e XR 300L Tornado.</div>`;return `<div class="warn">Códigos por número de piscadas, válidos para as Honda injetadas Biz, Titan 150, Titan 160, Pop 110i, CB 300, CB 300F, CB 250F, CG 125i, CG Start, CRF 250F, Fan 150, NXR Bros, NX 400i Falcon, XRE e XR 300L Tornado, informados pelo proprietário do projeto. A aplicação por modelo e ano ainda não foi confirmada: o mesmo código pode ter significado diferente entre modelos. Confirme na documentação da versão antes de concluir o diagnóstico.</div><input placeholder="Pesquisar código ou componente (ex.: 8, TPS, injetor)" value="${esc(S.cq)}" oninput="S.cq=this.value;$('#cl').innerHTML=cl()"><div id="cl">${cl()}</div>`}
function fic(){const m=MOTOS[S.m];let b="";const t=S.tab;
if(t=="vis")b=`<div class="card"><table><tr><td>Marca</td><td>${m.marca}</td></tr><tr><td>Modelo</td><td>${esc(m.modelo)}</td></tr><tr><td>Ano / versão</td><td>${m.ano}</td></tr><tr><td>Cilindrada, ignição, partida, carga, injeção</td><td class="mu">Dado não confirmado (cadastre no Admin)</td></tr></table></div><div class="warn">Esta versão não herda parâmetros de outros anos. Cada dado precisa ser cadastrado e conferido para este ano/versão.</div>`;
else if(t=="sin")b=`<button class="btn pri" onclick="S.sym=null;go('sym')" style="width:100%">Escolher sintoma para esta moto</button>`;
else if(t=="ele")b=tbl(recs(m,r=>["res","ten","cont","queda"].includes(r.tipo)));
else if(t=="cod")b=codes(m)+tbl(recs(m,r=>r.tipo==t));
else if(["res","ten","pin","mec"].includes(t))b=tbl(recs(m,r=>r.tipo==t));
else if(t=="his")b=hl(DB.his.filter(h=>h.moto==m.id));
else b=tbl(recs(m,r=>r.sis==t));
return `<button class="back" onclick="go('sel')">‹ Motos</button><h2>${esc(mn(m))}</h2><div class="tabs">${TABS.map(([k,n])=>`<button class="${t==k?"on":""}" onclick="S.tab='${k}';R()">${n}</button>`).join("")}</div>${S.eid?rform():addBtn(t)}${b}`}
function sym(){const m=S.m!=null?MOTOS[S.m]:null;
if(S.sym==null)return `<button class="back" onclick="go('${m?"fic":"home"}')">‹ Voltar</button><h2>Diagnóstico por sintomas</h2>${m?`<div class="card">Moto: <b>${esc(mn(m))}</b> <button class="back" onclick="S.m=null;R()">trocar</button></div>`:`<div class="warn">Selecione uma moto para adaptar o diagnóstico.</div><button class="btn" style="width:100%;margin-bottom:10px" onclick="go('sel')">🏍️ Selecionar motocicleta</button>`}
<label>Descreva com suas palavras (opcional)</label><textarea id="free" rows="2" placeholder="Ex.: falha só quando esquenta"></textarea>${SYM.map(s=>`<div class="card row" onclick="S.sym='${s}';R()"><span>${s}</span><span>›</span></div>`).join("")}`;
const hs=HY[S.sym]||FALLBACK,pq=PERG[S.sym]||[];
return `<button class="back" onclick="S.sym=null;R()">‹ Sintomas</button><h2>${S.sym}</h2>${m?`<p class="mu">${esc(mn(m))}</p>`:""}
<div class="warn">As causas abaixo são <b>hipóteses</b>, não defeitos confirmados. Teste antes de trocar peças. Medições de resistência: sempre com o circuito desenergizado.</div>
${pq.length?`<div class="card"><b>Perguntas de triagem</b><ul>${pq.map(q=>`<li>${q}</li>`).join("")}</ul></div>`:""}
${["A","B","C"].map(c=>{const l=hs.filter(h=>h.c==c);return l.length?`<h3>${c} — ${CATN[c]}</h3>`+l.map(h=>`<div class="card hy ${c}"><b>${h.t}</b><p class="mu" style="margin:6px 0">${h.w}</p>${m?`<span class="tag">Valores de referência: ${recs(m,r=>r.st=="verificado").length?"consulte as abas da ficha":"Dado não confirmado"}</span>`:""}</div>`).join(""):""}).join("")}
${m?`<button class="btn pri" style="width:100%" onclick="go('mm')">📟 Ir para teste com multímetro</button><button class="btn" style="width:100%;margin-top:8px" onclick="saveH()">💾 Registrar no histórico</button>`:""}`}
function saveH(){const o=prompt("Observações do atendimento (km, testes, resultado):");if(o===null)return;DB.his.unshift({id:Date.now(),moto:S.m,sym:S.sym,obs:o,d:new Date().toLocaleString("pt-BR")});save();alert("Diagnóstico registrado.")}
function mm(){const m=S.m!=null?MOTOS[S.m]:null;if(!m)return `<button class="back" onclick="go('home')">‹ Início</button><h2>Testes com multímetro</h2><div class="warn">Selecione a motocicleta primeiro.</div><button class="btn pri" style="width:100%" onclick="go('sel')">Selecionar motocicleta</button>`;
const rs=recs(m,r=>["res","ten","cont","queda"].includes(r.tipo));
return `<button class="back" onclick="go('fic')">‹ Ficha</button><h2>Testes com multímetro</h2><p class="mu">${esc(mn(m))}</p>
<div class="warn"><b>Segurança:</b> resistência e continuidade só com circuito desenergizado e conector desligado, quando aplicável. Siga o procedimento da versão.</div>
${rs.length?`<label>Componente / teste</label><select id="rs" onchange="$('#res').innerHTML=''">${rs.map(r=>`<option value="${r.id}">${esc(r.comp)} — ${TIPOS[r.tipo]}${r.st!="verificado"?" (não verificado)":""}</option>`).join("")}</select><label>Valor medido (${"unidade da especificação"})</label><input id="val" inputmode="decimal" placeholder="Ex.: 0,85"><button class="btn pri" style="width:100%" onclick="calc()">Interpretar medição</button><div id="res"></div>`:`<div class="card mu">Nenhum parâmetro cadastrado para esta versão. Não é possível avaliar com os dados disponíveis.</div>${AV}`}`}
function calc(){const r=DB.rec.find(x=>x.id==$("#rs").value),v=parseFloat(String($("#val").value).replace(",","."));let h;
if(isNaN(v))h=`<div class="warn">Informe um valor numérico.</div>`;
else if(r.st!="verificado")h=`<div class="warn err"><b>Não é possível avaliar:</b> o parâmetro ainda não foi verificado (${ST[r.st]}).</div>`;
else{const lo=parseFloat(String(r.min).replace(",",".")),hi=parseFloat(String(r.max).replace(",","."));
if(isNaN(lo)&&isNaN(hi))h=`<div class="warn">Faixa incompleta no cadastro: resultado inconclusivo.</div>`;
else if(!isNaN(lo)&&v<lo)h=`<div class="warn err"><b>Fora do parâmetro da fonte (abaixo da faixa) — confirmar no manual de serviço.</b> (${r.min}–${r.max||"?"} ${esc(r.un)}). Pode indicar curto, enrolamento danificado ou condição de teste diferente. Confira terminais e condições, e refaça a medição.</div>`;
else if(!isNaN(hi)&&v>hi)h=`<div class="warn err"><b>Fora do parâmetro da fonte (acima da faixa) — confirmar no manual de serviço.</b> ${r.min||"?"}–${r.max} ${esc(r.un)}). Pode indicar circuito aberto, mau contato ou resistência de contato. Verifique conectores e refaça.</div>`;
else h=`<div class="warn okb"><b>Dentro da especificação neste teste.</b> Isso não garante que o componente esteja totalmente bom: continue com os demais testes.</div>`;
h+=`<p class="mu">Condições exigidas: ${esc(r.cond||"Dado não confirmado")}</p>`}
$("#res").innerHTML=h}
function hl(l){return l.length?l.map(h=>`<div class="card"><b>${esc(MOTOS[h.moto]?mn(MOTOS[h.moto]):"")}</b><br><span class="mu">${h.d} · ${esc(h.sym)}</span><p>${esc(h.obs)}</p><button class="back" onclick="DB.his=DB.his.filter(x=>x.id!=${h.id});save();R()">Excluir</button></div>`).join(""):`<div class="card mu">Nenhum diagnóstico registrado.</div>`}
function hist(){return `<button class="back" onclick="go('home')">‹ Início</button><h2>Histórico de diagnósticos</h2>${hl(DB.his)}`}
function adm(){const e=S.ed||{};const o=(a,v)=>Object.entries(a).map(([k,n])=>`<option value="${k}" ${v==k?"selected":""}>${n}</option>`).join("");
return `<button class="back" onclick="go('home')">‹ Início</button><h2>Administração da base</h2>
<div class="warn">Cadastre apenas dados conferidos em fonte autorizada, com redação própria. Não copie tabelas ou páginas inteiras de materiais protegidos. Esta versão salva no próprio aparelho; para uso em equipe, o banco de dados no servidor (PostgreSQL) é o próximo passo.</div>
<div class="card"><label>Motocicleta / versão</label><select id="a_m">${MOTOS.map(m=>`<option value="${m.id}" ${e.moto==m.id?"selected":""}>${esc(mn(m))}</option>`).join("")}</select>
<label>Tipo de registro</label><select id="a_t">${o(TIPOS,e.tipo)}</select><label>Sistema</label><select id="a_s">${SIS.map(s=>`<option ${e.sis==s?"selected":""}>${s}</option>`).join("")}</select>
<label>Componente / código</label><input id="a_c" value="${esc(e.comp)}">
<div class="grid" style="grid-template-columns:repeat(4,1fr);gap:6px"><div><label>Mín</label><input id="a_a" value="${esc(e.min)}" inputmode="decimal"></div><div><label>Nominal</label><input id="a_n" value="${esc(e.nom)}" inputmode="decimal"></div><div><label>Máx</label><input id="a_b" value="${esc(e.max)}" inputmode="decimal"></div><div><label>Unid.</label><input id="a_u" value="${esc(e.un)}"></div></div>
<label>Condições da medição</label><input id="a_d" value="${esc(e.cond)}"><label>Método / descrição (texto próprio)</label><textarea id="a_e" rows="2">${esc(e.met)}</textarea>
<label>Fonte</label><input id="a_f" value="${esc(e.fonte||SRC)}"><label>Página ou seção</label><input id="a_p" value="${esc(e.pag)}">
<label>Situação de validação</label><select id="a_v">${o(ST,e.st||"pendente")}</select>
<button class="btn pri" style="width:100%" onclick="addR()">Salvar registro</button></div>
<h3>Registros (${DB.rec.length})</h3><select onchange="S.am=this.value;R()"><option value="">Escolha uma moto para ver os registros…</option>${MOTOS.filter(m=>cnt(m)>0).map(m=>`<option value="${m.id}" ${S.am==m.id?"selected":""}>${esc(mn(m))} (${cnt(m)})</option>`).join("")}</select>${DB.rec.filter(r=>S.am&&r.moto==S.am).map(r=>`<div class="card"><b>${esc(r.comp)}</b> ${tag(r.st)}<br><span class="mu">${esc(mn(MOTOS[r.moto]))} · ${TIPOS[r.tipo]}</span><br>
<select onchange="setSt(${r.id},this.value)">${Object.entries(ST).map(([k,n])=>`<option value="${k}" ${r.st==k?"selected":""}>${n}</option>`).join("")}</select><button class="back" onclick="S.eid=${r.id};S.tab='${r.tipo}';go('fic',${r.moto})">Editar</button> <button class="back" onclick="delRec(${r.id})">Desativar</button></div>`).join("")}
<h3>Histórico de alterações</h3>${DB.log.slice(0,15).map(l=>`<div class="mu">${l}</div>`).join("")||`<div class="mu">Sem alterações.</div>`}`}
function addR(){const c=$("#a_c").value.trim();if(!c){alert("Informe o componente.");return}
const r={id:Date.now(),moto:+$("#a_m").value,tipo:$("#a_t").value,sis:$("#a_s").value,comp:c,min:$("#a_a").value,nom:$("#a_n").value,max:$("#a_b").value,un:$("#a_u").value,cond:$("#a_d").value,met:$("#a_e").value,fonte:$("#a_f").value,pag:$("#a_p").value,st:$("#a_v").value,data:new Date().toLocaleDateString("pt-BR")};
DB.rec.push(r);DB.log.unshift(`${new Date().toLocaleString("pt-BR")} — cadastrado: ${c}`);S.ed=null;save();R()}
function setSt(id,v){const r=DB.rec.find(x=>x.id==id);DB.log.unshift(`${new Date().toLocaleString("pt-BR")} — ${r.comp}: ${ST[r.st]} → ${ST[v]}`);r.st=v;r.data=new Date().toLocaleDateString("pt-BR");save();R()}
function delRec(id,hard){if(hard){DB.rec=DB.rec.filter(x=>x.id!=id);save();R();return}setSt(id,"inativo")}
R();
</script></body></html>
